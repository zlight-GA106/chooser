<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <meta name="description" content="选择器 by zlight106：本地保存的轻量题库，支持单选、多选、判断和随机考试。">
  <title>选择器 by zlight106</title>
  <link rel="icon" href="icon.ico?v=1.4.1">
  <link rel="manifest" href="manifest.webmanifest?v=1.4.1">
  <link rel="stylesheet" href="style.css?v=1.4.1">
  <script defer src="core.js?v=1.4.1"></script>
  <script defer src="storage.js?v=1.4.1"></script>
  <script defer src="app.js?v=1.4.1"></script>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="brand" href="#home" data-act="home" aria-label="选择器首页"><img class="brand-icon" src="icon.svg?v=1.4.1" width="36" height="36" alt=""><span>选择器</span></a>
      <nav class="display-controls" aria-label="显示设置">
        <button type="button" data-act="smaller" aria-label="缩小字号">A−</button>
        <button type="button" data-act="larger" aria-label="放大字号">A+</button>
        <button type="button" data-act="theme" id="theme-button">深色</button>
        <button type="button" data-act="fullscreen" id="fullscreen-button">全屏</button>
        <a class="button help-link" href="help.html">帮助</a>
      </nav>
    </header>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main id="app" tabindex="-1" aria-live="off"><section class="card"><h1>题库选择器</h1><p>正在读取本机题库…</p></section></main>
    <noscript><section class="card">请启用浏览器的 JavaScript 后使用。</section></noscript>
  </div>
  <input id="xml-input" type="file" accept=".xml,text/xml,application/xml" multiple hidden>
  <input id="backup-input" type="file" accept=".json,application/json" hidden>
  <div id="modal" class="modal-backdrop" hidden></div>
</body>
</html>
